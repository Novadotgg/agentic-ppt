[project]
name = "nova-ppt-gen"
version = "1.0.0"
description = "Agentic AI Presentation Generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-pptx>=1.0.0",
    "Pillow>=10.0.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[tool.vercel]
entrypoint = "backend.main:app"
